[workspace]
members = ["crates/hosila-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.2.3"
edition = "2021"
authors = ["Hosila"]
license = "Proprietary"

[profile.dev.package.argon2]
opt-level = 2

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
argon2 = { version = "0.5", features = ["std"] }
rusqlite = { version = "0.42", features = ["bundled", "backup"] }
r2d2 = "0.8"
r2d2_sqlite = "0.37"
calamine = { version = "0.38", features = ["dates"] }
rust_xlsxwriter = "0.103"
strsim = "0.11"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
base64 = "0.22"
sha2 = "0.10"
specta = { version = "=2.0.0-rc.28", features = ["derive", "function", "chrono", "uuid", "serde_json"] }
specta-typescript = "0.0.15"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
